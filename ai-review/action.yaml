name: "AI Code Review"
description: "Reviews a pull request with the review-pr skill in a read-only agent loop over an OpenAI-compatible chat completions API and posts the result as a PR review"
inputs:
  api-key:
    description: "API key for the OpenAI-compatible endpoint"
    required: true
  endpoint:
    description: "Base URL of an OpenAI-compatible API (chat completions endpoint is resolved relative to it)"
    required: false
    default: "https://generativelanguage.googleapis.com/v1beta/openai/"
  model:
    description: "Model name to use for the review"
    required: false
    default: "gemini-3.6-flash"
  fallback-model:
    description: "Model name to retry with if the primary model errors (e.g. due to rate limiting)"
    required: false
    default: "gemini-3.5-flash-lite"
  support-model:
    description: "Smaller model for support tasks: it checks each staged finding before posting (findings that don't name a problem or propose a fix are dropped) and selects the relevant lines of large fetch_url responses. Empty disables both"
    required: false
    default: "gemini-3.5-flash-lite"
  github-token:
    description: "The GITHUB_TOKEN required to read the PR and post the review"
    required: false
    default: ${{ github.token }}
  pr-number:
    description: "The pull request number to review"
    required: false
    default: ${{ github.event.pull_request.number }}
  title:
    description: "Title identifying this reviewer, prefixed to the posted review (useful when multiple ai-review workflows run against the same PR)"
    required: false
    default: "AI Code Review"
  skills-ref:
    description: "Commit SHA of safe-research/agents to load the skills from"
    required: false
    default: "3e2cbcbc9865a2cd285c0dbeebd9954bce8e3d71"
  skill:
    description: "Name of the skill that defines the review instructions"
    required: false
    default: "review-pr"
  max-turns:
    description: "Maximum number of agent turns before the model is asked to submit its review"
    required: false
    default: "40"
  fetch-allowlist:
    description: "Hosts the agent may send HTTPS GET requests to (comma- or newline-separated exact hostnames), or * for any public host; empty disables network access"
    required: false
    default: ""
  fetch-blocklist:
    description: "Domains the agent may never fetch from, including their subdomains (comma- or newline-separated), e.g. your tailnet's ts.net domain"
    required: false
    default: ""
  fetch-sources:
    description: "Additional sources the agent is told about, one per line: what the source covers and how to use it, with at least one https URL (e.g. a docs llms.txt or a docs search API). Lines whose hosts aren't allowed by fetch-allowlist or are blocked are skipped with a warning"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # The PR code is untrusted: it is only read by the agent's tools, never executed, and no credentials are kept.
    - name: Check out PR
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        ref: refs/pull/${{ inputs.pr-number }}/head
        path: .ai-review/pr
        fetch-depth: 0
        persist-credentials: false
        token: ${{ inputs.github-token }}
    - name: Check out skills
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: safe-research/agents
        ref: ${{ inputs.skills-ref }}
        path: .ai-review/agents
        persist-credentials: false
    - name: Review PR
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        API_KEY: ${{ inputs.api-key }}
        API_ENDPOINT: ${{ inputs.endpoint }}
        MODEL: ${{ inputs.model }}
        FALLBACK_MODEL: ${{ inputs.fallback-model }}
        SUPPORT_MODEL: ${{ inputs.support-model }}
        PR_NUMBER: ${{ inputs.pr-number }}
        TITLE: ${{ inputs.title }}
        SKILL: ${{ inputs.skill }}
        MAX_TURNS: ${{ inputs.max-turns }}
        FETCH_ALLOWLIST: ${{ inputs.fetch-allowlist }}
        FETCH_BLOCKLIST: ${{ inputs.fetch-blocklist }}
        FETCH_SOURCES: ${{ inputs.fetch-sources }}
        REPO_PATH: ${{ github.workspace }}/.ai-review/pr
        SKILLS_PATH: ${{ github.workspace }}/.ai-review/agents
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const review = require(`${process.env.GITHUB_ACTION_PATH}/review.js`);
          await review({ github, context, core });
